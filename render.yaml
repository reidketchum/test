services:
  - type: web
    name: gocanvas-verification
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 "src.main:create_app_for_deploy()"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Add these in the Render dashboard (Settings > Environment):
      # DB_SERVER, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
      # GOCANVAS_USERNAME, GOCANVAS_API_KEY
      # ANTHROPIC_API_KEY
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM
      # FLASK_SECRET_KEY
